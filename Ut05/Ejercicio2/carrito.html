<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Formulario</title>
</head>
<body>
    <h1>Tienda</h1>

    <h2>Añadir producto</h2>
    <form method="get" action="carrito.php">
        <label for="add">Producto:</label>
        <select name="add" id="add">
            <option value="pan">Pan (1,00 €)</option>
            <option value="leche">Leche (1,25 €)</option>
            <option value="huevos">Huevos (1,70 €)</option>
        </select>
        <button type="submit">Añadir</button>
    </form>

    <h2>Vaciar carrito</h2>
    <form method="get" action="carrito.php">
        <input type="hidden" name="vaciar" value="1">
        <button type="submit">Vaciar carrito</button>
    </form>
    <form method="get" action="carrito.php">
        <button type="submit" name = "verCarrito" id="carrito" value="1">Ver carrito</button>
    </form>
    
</body>
</html>
